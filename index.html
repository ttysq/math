<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日计算打卡练习</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 18px 10px 40px;
    background: #eceff4;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .toolbar {
    max-width: 210mm;
    margin: 0 auto 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .toolbar button {
    padding: 10px 22px;
    font-size: 14px;
    font-family: inherit;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #2b7de9;
    color: #fff;
    transition: .15s;
  }
  .toolbar button:hover { background: #1a6ad4; }
  .toolbar button.gray { background: #6c757d; }
  .toolbar button.gray:hover { background: #5a6268; }

  /* ================= A4 纸张 ================= */
  .paper {
    width: 210mm;
    min-height: 297mm;
    padding: 8mm 12mm;
    margin: 0 auto;
    background: #fff;
    color: #000;
    font-family: "SimSun", "宋体", serif;
    box-shadow: 0 2px 16px rgba(0,0,0,.14);
  }
  .paper.exporting { box-shadow: none !important; margin: 0 !important; min-height: auto; }

  .paper h1 {
    font-size: 15pt;
    line-height: 8mm;
    margin: 0 0 2mm 0;
    text-align: center;
    letter-spacing: 2px;
    font-weight: bold;
  }
  .info {
    font-size: 10pt;
    line-height: 5mm;
    margin: 0 0 3mm 0;
    text-align: center;
    letter-spacing: 1px;
  }
  .paper h2 {
    font-size: 11.5pt;
    line-height: 6mm;
    margin: 2mm 0 2mm 0;
    font-weight: bold;
  }

  /* 两列布局表格 */
  table.grid2 {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  table.grid2 td {
    width: 50%;
    vertical-align: top;
    padding: 0 0 4mm 0;
  }
  table.grid2 td:first-child { padding-right: 4mm; }
  table.grid2 td:last-child  { padding-left: 4mm; }

  /* ========== 一、脱式计算 ========== */
  .qtext {
    font-size: 11pt;
    line-height: 6mm;
    height: 6mm;
  }
  .qwork { height: 16mm; }

  /* ========== 二、竖式计算 ========== */
  .vq {
    font-size: 11pt;
    line-height: 6mm;
    height: 6mm;
    margin-bottom: 1mm;
  }
  
  /* 竖式分栏框 */
  .vbox-table {
    width: 100%;
    height: 38mm;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .vbox-table td {
    border: 1px solid #333;
    vertical-align: top;
    padding: 1.5mm 2mm;
  }
  .vbox-table td.vbox-left {
    border-right: 1px dashed #999; /* 中间虚线分隔 */
  }
  .hint {
    font-size: 9pt;
    color: #999;
    font-family: "SimSun", "宋体", serif;
  }

  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; padding: 0; }
    .toolbar { display: none !important; }
    .paper { box-shadow: none; margin: 0; min-height: auto; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="generate()">🔄 重新生成题目</button>
  <button onclick="downloadPDF()">📥 下载 PDF 文档</button>
  <button class="gray" onclick="window.print()">🖨 打印 / 另存为 PDF</button>
</div>

<div class="paper" id="paper">
  <h1>每日计算打卡练习</h1>
  <div class="info">姓名：____________　　班级：____________　　得分：____________</div>

  <h2>一、脱式计算（注意运算顺序，含小括号和中括号）</h2>
  <table class="grid2" id="mixedTable"><tbody></tbody></table>

  <h2>二、竖式计算并验算</h2>
  <table class="grid2" id="verticalTable"><tbody></tbody></table>
</div>

<script>
/* ===================== 基础工具 ===================== */
function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function factorsOf(n) {
  const r = [];
  for (let i = 2; i * i <= n; i++) {
    if (n % i === 0) {
      r.push(i);
      if (n / i !== i) r.push(n / i);
    }
  }
  r.push(n);
  return r;
}

/* ===================== 混合运算模板（8 个） ===================== */
const mixedTemplates = [
  /* 1) a × (b + c) ÷ d */
  function () {
    for (let t = 0; t < 500; t++) {
      const a = rnd(2, 12), b = rnd(5, 30), c = rnd(5, 40);
      const p = a * (b + c);
      const ds = factorsOf(p).filter(x => x >= 2 && x <= 12 && p / x >= 2 && p / x <= 200);
      if (!ds.length) continue;
      const d = pick(ds);
      return { text: `${a} × (${b} + ${c}) ÷ ${d}` };
    }
    return { text: `8 × (12 + 18) ÷ 4` };
  },

  /* 2) a × [ (b + c) ÷ d ] */
  function () {
    const d = rnd(2, 9), q = rnd(3, 20), sum = d * q;
    const b = rnd(2, sum - 2), c = sum - b, a = rnd(2, 9);
    return { text: `${a} × [ (${b} + ${c}) ÷ ${d} ]` };
  },

  /* 3) [ (a + b) × c ] ÷ d */
  function () {
    for (let t = 0; t < 500; t++) {
      const a = rnd(5, 40), b = rnd(5, 40), c = rnd(2, 9);
      const p = (a + b) * c;
      const ds = factorsOf(p).filter(x => x >= 2 && x <= 12 && p / x >= 2 && x !== c && p / x <= 200);
      if (!ds.length) continue;
      const d = pick(ds);
      return { text: `[ (${a} + ${b}) × ${c} ] ÷ ${d}` };
    }
    return { text: `[ (25 + 15) × 6 ] ÷ 8` };
  },

  /* 4) a × [ b - (c - d) ] */
  function () {
    const c = rnd(12, 30), d = rnd(2, c - 2), inner = c - d;
    const b = rnd(inner + 2, inner + 30), a = rnd(2, 12);
    return { text: `${a} × [ ${b} - (${c} - ${d}) ]` };
  },

  /* 5) (a - b) × [ c + d ] */
  function () {
    const b = rnd(5, 40), a = b + rnd(3, 40);
    const c = rnd(5, 40), d = rnd(5, 40);
    return { text: `(${a} - ${b}) × [ ${c} + ${d} ]` };
  },

  /* 6) [ a - (b + c) ] × d */
  function () {
    const b = rnd(5, 30), c = rnd(5, 30), a = b + c + rnd(3, 40), d = rnd(2, 12);
    return { text: `[ ${a} - (${b} + ${c}) ] × ${d}` };
  },

  /* 7) [ (a + b) ÷ c ] × d */
  function () {
    const c = rnd(2, 9), q = rnd(3, 20), sum = c * q;
    const a = rnd(2, sum - 2), b = sum - a, d = rnd(2, 9);
    return { text: `[ (${a} + ${b}) ÷ ${c} ] × ${d}` };
  },

  /* 8) [ a + (b - c) ] × d */
  function () {
    const c = rnd(5, 30), b = c + rnd(3, 30), a = rnd(5, 60), d = rnd(2, 12);
    return { text: `[ ${a} + (${b} - ${c}) ] × ${d}` };
  }
];

/* ===================== 竖式题生成 ===================== */
function genMul() {
  const a = rnd(102, 989);
  let b;
  do { b = rnd(12, 98); } while (b % 10 === 0);
  return { text: `${a} × ${b} =` };
}

function genDiv() {
  for (let t = 0; t < 800; t++) {
    const divisor = rnd(12, 89);
    const qMin = Math.max(3, Math.ceil(100 / divisor));
    const qMax = Math.floor(999 / divisor);
    if (qMax < qMin) continue;
    const q = rnd(qMin, qMax);
    const r = Math.random() < 0.5 ? 0 : rnd(1, divisor - 1);
    const dividend = divisor * q + r;
    if (dividend >= 100 && dividend <= 999) {
      return { text: `${dividend} ÷ ${divisor} =` };
    }
  }
  return { text: '864 ÷ 24 =' };
}

/* ===================== 渲染题目 ===================== */
function generate() {

  /* ---- 一、混合运算 5 题（两列） ---- */
  const idxs = shuffle([0, 1, 2, 3, 4, 5, 6, 7]).slice(0, 5);
  const mixed = idxs.map((ti, i) => {
    const q = mixedTemplates[ti]();
    return { no: i + 1, text: q.text };
  });

  let mhtml = '';
  for (let r = 0; r < 3; r++) {
    mhtml += '<tr>';
    for (let c = 0; c < 2; c++) {
      const item = mixed[r * 2 + c];
      if (item) {
        mhtml +=
          '<td>' +
            '<div class="qtext">' + item.no + '. ' + item.text + '</div>' +
            '<div class="qwork"></div>' +
          '</td>';
      } else {
        mhtml += '<td></td>';
      }
    }
    mhtml += '</tr>';
  }
  document.querySelector('#mixedTable tbody').innerHTML = mhtml;

  /* ---- 二、竖式计算并验算 5 题（两列，3 乘 2 除） ---- */
  const kinds = shuffle(['mul', 'mul', 'mul', 'div', 'div']);
  const vitems = kinds.map((k, i) => {
    const q = (k === 'mul') ? genMul() : genDiv();
    return { no: i + 1, text: q.text };
  });

  let vhtml = '';
  for (let r = 0; r < 3; r++) {
    vhtml += '<tr>';
    for (let c = 0; c < 2; c++) {
      const item = vitems[r * 2 + c];
      if (item) {
        vhtml +=
          '<td>' +
            '<div class="vq">' + item.no + '. ' + item.text + '</div>' +
            '<table class="vbox-table">' +
              '<tr>' +
                '<td class="vbox-left"><span class="hint">计算</span></td>' +
                '<td class="vbox-right"><span class="hint">验算</span></td>' +
              '</tr>' +
            '</table>' +
          '</td>';
      } else {
        vhtml += '<td></td>';
      }
    }
    vhtml += '</tr>';
  }
  document.querySelector('#verticalTable tbody').innerHTML = vhtml;
}

/* ===================== 下载 PDF ===================== */
function timeStamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' +
         p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

function downloadPDF() {
  if (typeof html2pdf === 'undefined') {
    alert('PDF 生成库尚未加载完成，请稍后重试，或点击“打印 / 另存为 PDF”按钮。');
    return;
  }
  const el = document.getElementById('paper');
  el.classList.add('exporting');

  const opt = {
    margin: 0,
    filename: '每日计算打卡练习_' + timeStamp() + '.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: {
      scale: 2,
      useCORS: true,
      logging: false,
      backgroundColor: '#ffffff'
    },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'] }
  };

  html2pdf().set(opt).from(el).save().then(function () {
    el.classList.remove('exporting');
  }).catch(function (e) {
    el.classList.remove('exporting');
    console.error(e);
    alert('PDF 生成失败，请尝试使用“打印 / 另存为 PDF”按钮。');
  });
}

/* ===================== 启动 ===================== */
generate();
</script>
</body>
</html>
